{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <title>StoreHub — Continue with Google</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{% static 'users/style/style.css' %}">
  <link rel="stylesheet" href="{% static 'landing/style/style.css' %}">
</head>
<body>
  <nav>
    <a href="{% url 'home' %}" class="brand">
      <img src="{% static 'landing/imgs/logo.png' %}" alt="StoreHub logo" id="logo">
    </a>
  </nav>
  <div class="login-container">
    <form method="POST" class="login-form">
      {% csrf_token %}
      <div class="form-header">
        <h2>Continue with Google</h2>
        <p>You're about to sign in to StoreHub using your Google account.</p>
      </div>
      <button type="submit" class="submit-btn">Continue</button>
      <div class="form-footer">
        <a href="{% url 'account_login' %}" class="link-btn">Cancel</a>
      </div>
    </form>
  </div>
</body>
</html>
