{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <title>StoreHub — Change Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="{% static 'landing/style/style.css' %}">
  <link rel="stylesheet" href="{% static 'users/style/auth_forms.css' %}">
  <link rel="shortcut icon" href="{% static 'landing/imgs/favicon.png' %}" type="image/x-icon">
</head>

<body>
  <nav>
    <a href="{% url 'home' %}" class="brand">
      <img src="{% static 'landing/imgs/logo.png' %}" alt="StoreHub logo" id="logo">
    </a>

    <div class="nav-links">
      <a href="#merchants">For Merchants</a>
      <a href="#customers">For Customers</a>
      {% if not request.user.is_authenticated %}
        <a href="{% url 'register' %}" class="get-started">Get Started</a>
      {% else %}
        <a href="{% url 'profile' %}" class="get-started">My Profile</a>
      {% endif %}
    </div>
  </nav>

  <div class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="lock-icon-bg">
          <img src="https://img.icons8.com/fluency/48/000000/fingerprint--v1.png" alt="security-icon">
        </div>
        <h2>Secure Your Account</h2>
        <p>Enter your current password and choose a new one below.</p>
      </div>

      <form method="POST" class="modern-auth-form" id="passwordForm">
        {% csrf_token %}
        
        <div class="form-content">
          {{ form.as_p }}
        </div>

        <button type="submit" class="btn-update-pw">Update Password Now</button>
        
        <div class="auth-footer">
          <a href="{% url 'profile' %}" class="link-back">← Back to Settings</a>
        </div>
      </form>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
        // بنختار كل نصوص المساعدة اللي ديجانجو مطلعها
        const helpTexts = document.querySelectorAll('.helptext');
        
        helpTexts.forEach(text => {
            // لو النص فيه كلمة "same password as before" بنغيره فوراً
            if (text.innerText.includes("same password as before")) {
                text.innerText = "Enter the same password as the NEW one above for verification.";
            }
        });
    });
  </script>

</body>
</html>
